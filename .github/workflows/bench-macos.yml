# macOS workload: a clean build of XcodeBenchmark, a large iOS project made for
# comparing Macs. Each run records the machine, the Xcode version and the build
# time. Run it with a runner label (GitHub-hosted, or a Build Hub pool later).
name: bench-macos
on:
  workflow_dispatch:
    inputs:
      runs:
        description: How many runs
        default: "5"
      runner:
        description: runs-on value as JSON, for example "macos-15" or ["bitrise-runner-mac", "image:xcode-26"]
        default: '"macos-15"'
      label:
        description: Name for this runner in the results
        default: github-macos-15

env:
  XCODEBENCHMARK_SHA: 7dadf2d7a545

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      runs: ${{ steps.n.outputs.runs }}
    steps:
      - id: n
        run: echo "runs=$(python3 -c "import json; print(json.dumps(list(range(1, int('${{ inputs.runs }}') + 1))))")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: Machine
        run: |
          {
            echo "cpus=$(sysctl -n hw.ncpu)"
            echo "model=$(sysctl -n machdep.cpu.brand_string)"
            echo "memory_bytes=$(sysctl -n hw.memsize)"
            echo "os=macOS $(sw_vers -productVersion)"
            echo "xcode=$(xcodebuild -version | head -1)"
          } | tee machine.txt

      - name: Clone XcodeBenchmark
        run: |
          start=$(date +%s)
          git clone --quiet https://github.com/devMEremenko/XcodeBenchmark.git src
          git -C src checkout --quiet "$XCODEBENCHMARK_SHA"
          echo "clone_s=$(( $(date +%s) - start ))" >> times.txt

      - name: Build (clean)
        working-directory: src
        run: |
          start=$(date +%s)
          xcodebuild -workspace XcodeBenchmark.xcworkspace -scheme XcodeBenchmark \
            -destination generic/platform=iOS -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build -quiet > ../build.log 2>&1 || echo "build_failed=1" >> ../times.txt
          echo "build_s=$(( $(date +%s) - start ))" >> ../times.txt

      - name: Result
        run: |
          python3 - <<'PY'
          import json, os
          kv = lambda f: dict(l.strip().split("=", 1) for l in open(f) if "=" in l)
          m, t = kv("machine.txt"), kv("times.txt")
          out = {"workload": "macos-xcodebenchmark", "label": os.environ["LABEL"], "run": int(os.environ["RUN"]),
                 "machine": m, "times": {k: float(v) for k, v in t.items()}}
          json.dump(out, open("result.json", "w"), indent=2)
          print(json.dumps(out, indent=2))
          PY
        env:
          LABEL: ${{ inputs.label }}
          RUN: ${{ matrix.run }}

      - uses: actions/upload-artifact@v4
        with:
          name: result-macos-${{ inputs.label }}-${{ matrix.run }}
          path: |
            result.json
            build.log
          retention-days: 30
